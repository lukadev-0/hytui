[package]
name = "hytui"
version = "0.1.0"
edition = "2024"
default-run = "hytui"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
async-executor = "1.14.0"
async-io = "2.6.0"
async-net = "2.0.0"
bytes = "1.12.1"
crossterm = "0.29.0"
futures-lite = "2.6.1"
futures-rustls = "0.26.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
pin-project-lite = "0.2.17"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
rustls-platform-verifier = "0.7.1"
